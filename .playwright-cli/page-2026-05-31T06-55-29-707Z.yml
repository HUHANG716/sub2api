        - heading "Questions? We have answers" [level=2] [ref=e225]
        - generic [ref=e226]: Common questions about integration, stability, team management, and getting started.
      - generic [ref=e227]:
        - article [ref=e228]:
          - heading "What teams is Hahacode best for?" [level=3] [ref=e229]
          - paragraph [ref=e230]: It is built for individual developers or teams already using AI coding tools and looking for unified access, permissions, usage records, and reliability controls.
        - article [ref=e231]:
          - heading "Why not let everyone configure tools on their own?" [level=3] [ref=e232]
          - paragraph [ref=e233]: Individual configuration can be fast at small scale, but team collaboration often brings scattered keys, unclear permissions, invisible usage, and difficult troubleshooting. A unified entry point lowers that long-term cost.
        - article [ref=e234]:
          - heading "How is service reliability protected?" [level=3] [ref=e235]
          - paragraph [ref=e236]: The platform continuously monitors channel status, request routing, failure handling, and usage records to make high-frequency calling scenarios more controllable.
        - article [ref=e237]:
          - heading "How do I get started?" [level=3] [ref=e238]
          - paragraph [ref=e239]: Log in to the workspace and follow the docs to complete the basic setup. For teams, start by organizing members, groups, and common development tools.
