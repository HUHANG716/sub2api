      - generic [ref=e225]:
        - paragraph [ref=e226]: FAQ
        - heading "Questions? We have answers" [level=2] [ref=e227]
        - generic [ref=e228]: Common questions about integration, stability, team management, and getting started.
      - generic [ref=e229]:
        - article [ref=e230]:
          - heading "What teams is Sub2API best for?" [level=3] [ref=e231]
          - paragraph [ref=e232]: It is built for individual developers or teams already using AI coding tools and looking for unified access, permissions, usage records, and reliability controls.
        - article [ref=e233]:
          - heading "Why not let everyone configure tools on their own?" [level=3] [ref=e234]
          - paragraph [ref=e235]: Individual configuration can be fast at small scale, but team collaboration often brings scattered keys, unclear permissions, invisible usage, and difficult troubleshooting. A unified entry point lowers that long-term cost.
        - article [ref=e236]:
          - heading "How is service reliability protected?" [level=3] [ref=e237]
          - paragraph [ref=e238]: The platform continuously monitors channel status, request routing, failure handling, and usage records to make high-frequency calling scenarios more controllable.
        - article [ref=e239]:
          - heading "How do I get started?" [level=3] [ref=e240]
          - paragraph [ref=e241]: Log in to the workspace and follow the docs to complete the basic setup. For teams, start by organizing members, groups, and common development tools.
