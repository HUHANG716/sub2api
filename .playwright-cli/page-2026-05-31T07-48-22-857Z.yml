      - generic [ref=e233]:
        - paragraph [ref=e234]: FAQ
        - heading "Questions? We have answers" [level=2] [ref=e235]
        - generic [ref=e236]: Common questions about integration, stability, team management, and getting started.
      - generic [ref=e237]:
        - article [ref=e238]:
          - heading "What teams is Hahacode best for?" [level=3] [ref=e239]
          - paragraph [ref=e240]: It is built for individual developers or teams already using AI coding tools and looking for unified access, permissions, usage records, and reliability controls.
        - article [ref=e241]:
          - heading "Why not let everyone configure tools on their own?" [level=3] [ref=e242]
          - paragraph [ref=e243]: Individual configuration can be fast at small scale, but team collaboration often brings scattered keys, unclear permissions, invisible usage, and difficult troubleshooting. A unified entry point lowers that long-term cost.
        - article [ref=e244]:
          - heading "How is service reliability protected?" [level=3] [ref=e245]
          - paragraph [ref=e246]: The platform continuously monitors channel status, request routing, failure handling, and usage records to make high-frequency calling scenarios more controllable.
        - article [ref=e247]:
          - heading "How do I get started?" [level=3] [ref=e248]
          - paragraph [ref=e249]: Log in to the workspace and follow the docs to complete the basic setup. For teams, start by organizing members, groups, and common development tools.
