      - generic [ref=e228]:
        - paragraph [ref=e229]: FAQ
        - heading "Questions? We have answers" [level=2] [ref=e230]
        - generic [ref=e231]: Common questions about integration, stability, team management, and getting started.
      - generic [ref=e232]:
        - article [ref=e233]:
          - heading "What teams is Hahacode best for?" [level=3] [ref=e234]
          - paragraph [ref=e235]: It is built for individual developers or teams already using AI coding tools and looking for unified access, permissions, usage records, and reliability controls.
        - article [ref=e236]:
          - heading "Why not let everyone configure tools on their own?" [level=3] [ref=e237]
          - paragraph [ref=e238]: Individual configuration can be fast at small scale, but team collaboration often brings scattered keys, unclear permissions, invisible usage, and difficult troubleshooting. A unified entry point lowers that long-term cost.
        - article [ref=e239]:
          - heading "How is service reliability protected?" [level=3] [ref=e240]
          - paragraph [ref=e241]: The platform continuously monitors channel status, request routing, failure handling, and usage records to make high-frequency calling scenarios more controllable.
        - article [ref=e242]:
          - heading "How do I get started?" [level=3] [ref=e243]
          - paragraph [ref=e244]: Log in to the workspace and follow the docs to complete the basic setup. For teams, start by organizing members, groups, and common development tools.
