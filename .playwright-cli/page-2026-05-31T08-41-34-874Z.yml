      - generic [ref=e231]:
        - paragraph [ref=e232]: FAQ
        - heading "Questions? We have answers" [level=2] [ref=e233]
        - generic [ref=e234]: Common questions about integration, stability, team management, and getting started.
      - generic [ref=e235]:
        - article [ref=e236]:
          - heading "What teams is Sub2API best for?" [level=3] [ref=e237]
          - paragraph [ref=e238]: It is built for individual developers or teams already using AI coding tools and looking for unified access, permissions, usage records, and reliability controls.
        - article [ref=e239]:
          - heading "Why not let everyone configure tools on their own?" [level=3] [ref=e240]
          - paragraph [ref=e241]: Individual configuration can be fast at small scale, but team collaboration often brings scattered keys, unclear permissions, invisible usage, and difficult troubleshooting. A unified entry point lowers that long-term cost.
        - article [ref=e242]:
          - heading "How is service reliability protected?" [level=3] [ref=e243]
          - paragraph [ref=e244]: The platform continuously monitors channel status, request routing, failure handling, and usage records to make high-frequency calling scenarios more controllable.
        - article [ref=e245]:
          - heading "How do I get started?" [level=3] [ref=e246]
          - paragraph [ref=e247]: Log in to the workspace and follow the docs to complete the basic setup. For teams, start by organizing members, groups, and common development tools.
