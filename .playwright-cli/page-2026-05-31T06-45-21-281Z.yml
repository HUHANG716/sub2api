        - paragraph [ref=e219]: FAQ
        - heading "Questions? We have answers" [level=2] [ref=e220]
        - generic [ref=e221]: Common questions about integration, stability, team management, and getting started.
      - generic [ref=e222]:
        - article [ref=e223]:
          - heading "What teams is Hahacode best for?" [level=3] [ref=e224]
          - paragraph [ref=e225]: It is built for individual developers or teams already using AI coding tools and looking for unified access, permissions, usage records, and reliability controls.
        - article [ref=e226]:
          - heading "Why not let everyone configure tools on their own?" [level=3] [ref=e227]
          - paragraph [ref=e228]: Individual configuration can be fast at small scale, but team collaboration often brings scattered keys, unclear permissions, invisible usage, and difficult troubleshooting. A unified entry point lowers that long-term cost.
        - article [ref=e229]:
          - heading "How is service reliability protected?" [level=3] [ref=e230]
          - paragraph [ref=e231]: The platform continuously monitors channel status, request routing, failure handling, and usage records to make high-frequency calling scenarios more controllable.
        - article [ref=e232]:
          - heading "How do I get started?" [level=3] [ref=e233]
          - paragraph [ref=e234]: Log in to the workspace and follow the docs to complete the basic setup. For teams, start by organizing members, groups, and common development tools.
