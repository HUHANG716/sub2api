name: Deploy Dev

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - dev
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to code.hahacode.work
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')) }}
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://code.hahacode.work
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BAOLEYUN_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.BAOLEYUN_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ vars.BAOLEYUN_HOST }}
          DEPLOY_USER: ${{ vars.BAOLEYUN_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_SHA=${DEPLOY_SHA} bash -se" <<'REMOTE'
          set -euo pipefail

          SHORT_SHA="${DEPLOY_SHA:0:12}"
          REPO_DIR="/opt/sub2api/repo"
          RUNTIME_DIR="/opt/sub2api/runtime"
          IMAGE="local/sub2api:dev-${SHORT_SHA}"

          cd "$REPO_DIR"
          git fetch origin dev
          git checkout --detach "$DEPLOY_SHA"
          git status --short
          find backend/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort > /tmp/sub2api-dev-migrations.expected

          docker build \
            --build-arg COMMIT="$DEPLOY_SHA" \
            --build-arg DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE" .

          cd "$RUNTIME_DIR"
          docker compose up -d postgres redis
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U "${POSTGRES_USER:-sub2api}" -d "${POSTGRES_DB:-sub2api}" >/dev/null 2>&1; then
              break
            fi
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "Postgres did not become ready before deployment" >&2
              exit 1
            fi
          done
          if [ "$(docker compose exec -T postgres psql -U "${POSTGRES_USER:-sub2api}" -d "${POSTGRES_DB:-sub2api}" -Atc "SELECT to_regclass('public.schema_migrations') IS NOT NULL")" = "t" ]; then
            docker compose exec -T postgres psql -U "${POSTGRES_USER:-sub2api}" -d "${POSTGRES_DB:-sub2api}" -Atc \
              "SELECT filename FROM schema_migrations ORDER BY filename" > /tmp/sub2api-dev-migrations.applied
          else
            : > /tmp/sub2api-dev-migrations.applied
          fi
          if comm -23 /tmp/sub2api-dev-migrations.applied /tmp/sub2api-dev-migrations.expected | grep -q .; then
            echo "Database has migrations that are not present in the dev commit being deployed:" >&2
            comm -23 /tmp/sub2api-dev-migrations.applied /tmp/sub2api-dev-migrations.expected >&2
            echo "Refusing to deploy to avoid running dev code against a schema from another branch." >&2
            exit 1
          fi

          cp docker-compose.yml "docker-compose.yml.bak-dev-${SHORT_SHA}-$(date +%Y%m%d%H%M%S)"
          sed -i "s#image: local/sub2api:.*#image: ${IMAGE}#" docker-compose.yml

          docker compose up -d sub2api
          sleep 20
          docker compose ps

          curl -fsS http://127.0.0.1:8080/health
          curl -fsS https://code.hahacode.work/health
          REMOTE
