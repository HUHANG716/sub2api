name: Deploy Dev

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - dev
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: dev

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to code.hahacode.work
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev' && !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')) }}
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://code.hahacode.work
    steps:
      - name: Validate manual dispatch target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$GITHUB_REF_NAME" != "dev" ]; then
            echo "::error::Deploy Dev must be run from the dev branch workflow. Select Branch: dev."
            exit 1
          fi
          if [ "${{ inputs.ref }}" != "dev" ]; then
            echo "::error::Deploy Dev can only deploy ref=dev."
            exit 1
          fi

      - name: Check deploy image
        id: image
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${DEPLOY_SHA::12}"
          image="ghcr.io/${owner}/sub2api:dev-${short_sha}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

          if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
          fi
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend image found for ${image}; skipping backend deploy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check frontend artifact
        id: frontend_artifact
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.payload.workflow_run.id;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id,
              per_page: 100,
            });
            const artifact = data.artifacts.find((item) => item.name === 'frontend-dist' && !item.expired);
            core.setOutput('exists', artifact ? 'true' : 'false');
            if (artifact) {
              core.info(`Found frontend-dist artifact ${artifact.id}.`);
            } else {
              core.info('No frontend-dist artifact found; skipping frontend deploy.');
            }

      - name: Checkout
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || 'dev' }}

      - name: Setup pnpm
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: frontend
        run: pnpm run lint:check

      - name: Typecheck frontend
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: frontend
        run: pnpm run typecheck

      - name: Critical frontend tests
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: make test-frontend-critical

      - name: Build frontend
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: frontend
        run: pnpm run build

      - name: Download frontend dist
        if: ${{ github.event_name != 'workflow_dispatch' && steps.frontend_artifact.outputs.exists == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Package frontend dist from CI
        if: ${{ github.event_name != 'workflow_dispatch' && steps.frontend_artifact.outputs.exists == 'true' }}
        run: tar -C frontend-dist -czf frontend-dist.tar.gz .

      - name: Package frontend dist from manual build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: tar -C backend/internal/web/dist -czf frontend-dist.tar.gz .

      - name: Configure SSH
        if: ${{ steps.image.outputs.exists == 'true' || github.event_name == 'workflow_dispatch' || steps.frontend_artifact.outputs.exists == 'true' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SEOUL_SSH_KEY }}" > ~/.ssh/id_seoul
          chmod 600 ~/.ssh/id_seoul
          printf '%s\n' "${{ secrets.SEOUL_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend on server
        if: ${{ steps.image.outputs.exists == 'true' }}
        env:
          DEPLOY_HOST: ${{ vars.SEOUL_HOST }}
          DEPLOY_USER: ${{ vars.SEOUL_USER }}
          DEPLOY_REF: ${{ github.event.workflow_run.head_branch || inputs.ref || 'dev' }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          case "$DEPLOY_REF" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "Invalid DEPLOY_REF: $DEPLOY_REF" >&2
              exit 1
              ;;
          esac
          case "$DEPLOY_SHA" in
            ''|[0-9a-fA-F]*)
              ;;
            *)
              echo "Invalid DEPLOY_SHA: $DEPLOY_SHA" >&2
              exit 1
              ;;
          esac

          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          deploy_image_name="ghcr.io/${owner}/sub2api"

          printf -v DEPLOY_REF_Q '%q' "$DEPLOY_REF"
          printf -v DEPLOY_SHA_Q '%q' "$DEPLOY_SHA"
          printf -v DEPLOY_IMAGE_NAME_Q '%q' "$deploy_image_name"
          printf -v GHCR_USERNAME_Q '%q' "$GHCR_USERNAME"
          {
            printf '%s\n' "$GHCR_TOKEN"
            cat <<'REMOTE'
          set -euo pipefail

          REPO_DIR="/opt/sub2api-dev/repo"
          RUNTIME_DIR="/opt/sub2api-dev/runtime"

          cd "$REPO_DIR"
          git fetch origin "$DEPLOY_REF"
          if [ -n "$DEPLOY_SHA" ]; then
            git checkout --detach "$DEPLOY_SHA"
          else
            git checkout --detach FETCH_HEAD
          fi
          git status --short
          DEPLOY_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${DEPLOY_SHA:0:12}"
          IMAGE="${DEPLOY_IMAGE_NAME}:dev-${SHORT_SHA}"
          find backend/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort > /tmp/sub2api-dev-migrations.expected

          cd "$RUNTIME_DIR"
          COMPOSE_PROJECT_NAME="sub2api-deploy"
          export COMPOSE_PROJECT_NAME

          if command -v caddy >/dev/null 2>&1 && [ -f /etc/caddy/Caddyfile ]; then
            caddyfile="/etc/caddy/Caddyfile"
            backup="${caddyfile}.bak-image-playground-${SHORT_SHA}-$(date +%Y%m%d%H%M%S)"
            sudo cp "$caddyfile" "$backup"
            sudo python3 - "$caddyfile" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          block = """
              # sub2api-dev-image-playground-csp
              handle /image-playground-app* {
                  reverse_proxy 127.0.0.1:8080 {
                      header_down -Content-Security-Policy
                      header_down Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
                      header_down -X-Frame-Options
                      header_down X-Frame-Options "SAMEORIGIN"
                  }
                  header {
                      >X-Frame-Options "SAMEORIGIN"
                      >Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
                  }
              }

              handle /image-playground {
                  reverse_proxy 127.0.0.1:8080 {
                      header_down -Content-Security-Policy
                      header_down Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-rN/mwjSDRbSp/GyWf3SbRSivx2cXMjUCUKQReJN0U0Y=' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://*.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://challenges.cloudflare.com https://*.stripe.com https://pay.ldxp.cn; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
                  }
                  header {
                      >Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-rN/mwjSDRbSp/GyWf3SbRSivx2cXMjUCUKQReJN0U0Y=' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://*.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-src 'self' https://challenges.cloudflare.com https://*.stripe.com https://pay.ldxp.cn; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
                  }
              }

              # sub2api-dev-image-playground-csp-end
          """
          managed_block_pattern = re.compile(
              r"\n[ \t]*# sub2api-dev-image-playground-csp\n"
              r".*?\n[ \t]*# sub2api-dev-image-playground-csp-end\n?",
              re.S,
          )
          text = managed_block_pattern.sub("", text)

          def find_site_block(source: str, host: str) -> tuple[int, int] | None:
              for match in re.finditer(r"(?m)^[ \t]*([^#\n{]*\b" + re.escape(host) + r"\b[^{}\n]*)\{", source):
                  open_brace = match.end() - 1
                  depth = 0
                  for index in range(open_brace, len(source)):
                      char = source[index]
                      if char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              return open_brace, index
              return None

          site_block = find_site_block(text, "code.hahacode.work")
          if site_block is None:
              print("Caddyfile insertion point not found; showing likely site labels:", file=sys.stderr)
              for line_no, line in enumerate(text.splitlines(), 1):
                  stripped = line.strip()
                  if stripped.endswith("{") and not stripped.startswith(("#", "@", "header ", "handle", "route", "reverse_proxy")):
                      print(f"{line_no}: {stripped[:160]}", file=sys.stderr)
              raise SystemExit(1)

          open_brace, _ = site_block
          text = text[:open_brace + 1] + block + text[open_brace + 1:]
          path.write_text(text)
          PY
            sudo sed -n '/sub2api-dev-image-playground-csp/,+35p' "$caddyfile"
            if sudo caddy validate --config "$caddyfile"; then
              if ! sudo systemctl reload caddy; then
                echo "Caddy reload failed; restarting caddy because this server does not expose the admin reload endpoint." >&2
                sudo systemctl restart caddy
              fi
              sudo systemctl is-active --quiet caddy
            else
              sudo systemctl status caddy --no-pager -l || true
              sudo journalctl -u caddy --no-pager -n 80 || true
              sudo cp "$backup" "$caddyfile"
              sudo caddy validate --config "$caddyfile"
              sudo systemctl restart caddy || true
              echo "Failed to apply image playground Caddy headers; restored previous Caddyfile" >&2
              exit 1
            fi
          fi

          if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
          fi
          docker pull "$IMAGE"

          if docker compose version >/dev/null 2>&1; then
            compose_cmd="docker compose"
          else
            compose_cmd="docker-compose"
          fi

          $compose_cmd up -d postgres redis < /dev/null
          for i in $(seq 1 30); do
            if $compose_cmd exec -T postgres pg_isready -U "${POSTGRES_USER:-sub2api}" -d "${POSTGRES_DB:-sub2api}" < /dev/null >/dev/null 2>&1; then
              break
            fi
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "Postgres did not become ready before deployment" >&2
              exit 1
            fi
          done
          if [ "$($compose_cmd exec -T postgres psql -U "${POSTGRES_USER:-sub2api}" -d "${POSTGRES_DB:-sub2api}" -Atc "SELECT to_regclass('public.schema_migrations') IS NOT NULL" < /dev/null)" = "t" ]; then
            $compose_cmd exec -T postgres psql -U "${POSTGRES_USER:-sub2api}" -d "${POSTGRES_DB:-sub2api}" -Atc \
              "SELECT filename FROM schema_migrations ORDER BY filename" < /dev/null | LC_ALL=C sort > /tmp/sub2api-dev-migrations.applied
          else
            : > /tmp/sub2api-dev-migrations.applied
          fi
          if comm -23 /tmp/sub2api-dev-migrations.applied /tmp/sub2api-dev-migrations.expected | grep -q .; then
            echo "Database has migrations that are not present in the dev commit being deployed:" >&2
            comm -23 /tmp/sub2api-dev-migrations.applied /tmp/sub2api-dev-migrations.expected >&2
            echo "Refusing to deploy to avoid running dev code against a schema from another branch." >&2
            exit 1
          fi

          cp docker-compose.yml "docker-compose.yml.bak-dev-${SHORT_SHA}-$(date +%Y%m%d%H%M%S)"
          sed -i "/^[[:space:]]*sub2api:/,/^[[:space:]]*[A-Za-z0-9_-][A-Za-z0-9_-]*:/ s#^\([[:space:]]*image:[[:space:]]*\).*#\1${IMAGE}#" docker-compose.yml
          if [ -f docker-compose.override.yml ]; then
            cp docker-compose.override.yml "docker-compose.override.yml.bak-dev-${SHORT_SHA}-$(date +%Y%m%d%H%M%S)"
            sed -i "/^[[:space:]]*sub2api:/,/^[[:space:]]*[A-Za-z0-9_-][A-Za-z0-9_-]*:/ s#^\([[:space:]]*image:[[:space:]]*\).*#\1${IMAGE}#" docker-compose.override.yml
          fi
          if ! sed -n "/^[[:space:]]*sub2api:/,/^[[:space:]]*[A-Za-z0-9_-][A-Za-z0-9_-]*:/p" docker-compose.yml | grep -F "image: ${IMAGE}"; then
            echo "Failed to update sub2api image in docker-compose.yml" >&2
            exit 1
          fi
          if ! $compose_cmd config | grep -F "image: ${IMAGE}"; then
            echo "Compose resolved sub2api image is not ${IMAGE}" >&2
            exit 1
          fi

          app_containers="$(docker ps -aq --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" --filter "label=com.docker.compose.service=sub2api")"
          if [ -n "$app_containers" ]; then
            docker rm -f $app_containers
          fi
          $compose_cmd up -d --no-build --no-deps sub2api < /dev/null
          for i in $(seq 1 30); do
            app_health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' sub2api 2>/dev/null || true)"
            if [ "$app_health" = "healthy" ] || [ "$app_health" = "running" ]; then
              break
            fi
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "sub2api did not become healthy before deployment verification" >&2
              docker logs --tail 100 sub2api >&2 || true
              exit 1
            fi
          done
          $compose_cmd ps

          curl -fsS http://127.0.0.1:8080/health
          curl -fsS https://code.hahacode.work/health
          app_headers="$(mktemp)"
          shell_headers="$(mktemp)"
          curl -fsSI https://code.hahacode.work/image-playground-app/ -o "$app_headers"
          curl -fsSI https://code.hahacode.work/image-playground -o "$shell_headers"
          if ! grep -iq '^X-Frame-Options:[[:space:]]*SAMEORIGIN' "$app_headers"; then
            echo "image playground app must allow same-origin iframe embedding" >&2
            cat "$app_headers" >&2
            exit 1
          fi
          if ! grep -iq "frame-ancestors 'self'" "$app_headers"; then
            echo "image playground app CSP must include frame-ancestors 'self'" >&2
            cat "$app_headers" >&2
            exit 1
          fi
          if grep -iq "frame-ancestors 'none'" "$app_headers"; then
            echo "image playground app CSP must not include frame-ancestors 'none'" >&2
            cat "$app_headers" >&2
            exit 1
          fi
          if ! grep -iq "frame-src[^;]*'self'" "$shell_headers"; then
            echo "image playground shell CSP must allow same-origin iframe via frame-src 'self'" >&2
            cat "$shell_headers" >&2
            exit 1
          fi
          REMOTE
          } | ssh -i ~/.ssh/id_seoul "${DEPLOY_USER}@${DEPLOY_HOST}" "env DEPLOY_REF=${DEPLOY_REF_Q} DEPLOY_SHA=${DEPLOY_SHA_Q} DEPLOY_IMAGE_NAME=${DEPLOY_IMAGE_NAME_Q} GHCR_USERNAME=${GHCR_USERNAME_Q} sh -c 'IFS= read -r GHCR_TOKEN; export GHCR_TOKEN; bash -se'"

      - name: Deploy frontend files
        if: ${{ github.event_name == 'workflow_dispatch' || steps.frontend_artifact.outputs.exists == 'true' }}
        env:
          DEPLOY_HOST: ${{ vars.SEOUL_HOST }}
          DEPLOY_USER: ${{ vars.SEOUL_USER }}
        run: |
          scp -i ~/.ssh/id_seoul frontend-dist.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/sub2api-dev-frontend-dist.tar.gz"
          ssh -i ~/.ssh/id_seoul "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail

          RUNTIME_DIR="/opt/sub2api-dev/runtime"
          RELEASE_DIR="/tmp/sub2api-dev-frontend-dist"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf /tmp/sub2api-dev-frontend-dist.tar.gz -C "$RELEASE_DIR"
          test -f "$RELEASE_DIR/index.html"

          cd "$RUNTIME_DIR"
          COMPOSE_PROJECT_NAME="sub2api-deploy"
          export COMPOSE_PROJECT_NAME

          if docker compose version >/dev/null 2>&1; then
            compose_cmd="docker compose"
          else
            compose_cmd="docker-compose"
          fi
          CONTAINER_ID="$($compose_cmd ps -q sub2api)"
          if [ -z "$CONTAINER_ID" ]; then
            echo "sub2api container not found" >&2
            exit 1
          fi

          docker exec "$CONTAINER_ID" sh -c 'rm -rf /app/data/public.next /app/data/public.previous && mkdir -p /app/data/public.next'
          docker cp "${RELEASE_DIR}/." "$CONTAINER_ID:/app/data/public.next/"
          docker exec "$CONTAINER_ID" sh -c 'test -f /app/data/public.next/index.html && if [ -d /app/data/public ]; then mv /app/data/public /app/data/public.previous; fi && mv /app/data/public.next /app/data/public'

          rm -rf "$RELEASE_DIR"
          rm -f /tmp/sub2api-dev-frontend-dist.tar.gz

          curl -fsS http://127.0.0.1:8080/health
          curl -fsS https://code.hahacode.work/health
          REMOTE
