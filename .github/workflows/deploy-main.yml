name: Deploy Main

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main
      deploy_mode:
        description: 'Deployment mode: auto, frontend-only, or full-image'
        required: false
        default: auto
      frontend_dist_run_id:
        description: Optional CI run id whose frontend-dist artifact should be deployed without changing backend image
        required: false
        default: ''
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Baoleyun prod
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://code.hahacode.top
    steps:
      - name: Validate manual dispatch target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Deploy Main must be run from the main branch workflow. Select Branch: main."
            exit 1
          fi
          if [ "${{ inputs.ref }}" != "main" ]; then
            echo "::error::Deploy Main can only deploy ref=main."
            exit 1
          fi
          case "${{ inputs.deploy_mode }}" in
            auto|frontend-only|full-image)
              ;;
            *)
              echo "::error::deploy_mode must be auto, frontend-only, or full-image."
              exit 1
              ;;
          esac
          if [ -n "${{ inputs.frontend_dist_run_id }}" ]; then
            case "${{ inputs.frontend_dist_run_id }}" in
              *[!0-9]*)
                echo "::error::frontend_dist_run_id must be a GitHub Actions run id."
                exit 1
                ;;
            esac
          fi

      - name: Log automatic dispatch target
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          echo "Deploying successful main CI run ${{ github.event.workflow_run.id }}"
          echo "Target SHA: ${{ github.event.workflow_run.head_sha }}"

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BAOLEYUN_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.BAOLEYUN_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve deployment plan
        id: plan
        env:
          DEPLOY_HOST: ${{ vars.BAOLEYUN_HOST }}
          DEPLOY_USER: ${{ vars.BAOLEYUN_USER }}
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mode || 'auto' }}
          FRONTEND_DIST_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.frontend_dist_run_id || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          target_sha="$(git rev-parse HEAD)"
          deploy_state="$(
            ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /opt/sub2api/runtime
          docker compose config | awk '
            /^services:[[:space:]]*$/ {
              in_services = 1
              next
            }
            in_services && /^  sub2api:[[:space:]]*$/ {
              in_sub2api = 1
              next
            }
            in_sub2api && /^  [A-Za-z0-9_-]+:[[:space:]]*$/ {
              in_sub2api = 0
            }
            in_sub2api && /^[[:space:]]+image:[[:space:]]*/ {
              print $2
              exit
            }
          '
          docker compose exec -T sub2api sh -c 'cat /app/data/public/.deploy-sha 2>/dev/null || true' < /dev/null
          REMOTE
          )"
          deployed_image="$(printf '%s\n' "$deploy_state" | sed -n '1p')"
          frontend_deployed_sha="$(printf '%s\n' "$deploy_state" | sed -n '2p')"

          DEPLOYED_IMAGE="$deployed_image" FRONTEND_DEPLOYED_SHA="$frontend_deployed_sha" TARGET_SHA="$target_sha" bash .github/ci/resolve-main-deploy-plan.sh

      - name: Check deploy image
        id: image
        if: ${{ steps.plan.outputs.mode == 'image' }}
        env:
          DEPLOY_SHA: ${{ steps.plan.outputs.target_sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${DEPLOY_SHA::12}"
          image="ghcr.io/${owner}/sub2api:main-${short_sha}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

          if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
          fi
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend image found for ${image}; skipping image deploy."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip missing image deploy
        if: ${{ steps.plan.outputs.mode == 'image' && steps.image.outputs.exists != 'true' }}
        run: |
          echo "::notice::Deployment plan selected image mode, but no backend image exists for ${{ steps.plan.outputs.target_sha }}. Skipping deploy until a CI run publishes that image."

      - name: Download frontend dist
        if: ${{ steps.plan.outputs.mode == 'frontend' }}
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist
          run-id: ${{ steps.plan.outputs.frontend_dist_run_id }}
          github-token: ${{ github.token }}

      - name: Package frontend dist
        if: ${{ steps.plan.outputs.mode == 'frontend' }}
        run: tar -C frontend-dist -czf frontend-dist.tar.gz .

      - name: Deploy on server
        if: ${{ steps.plan.outputs.mode == 'image' && steps.image.outputs.exists == 'true' }}
        env:
          DEPLOY_HOST: ${{ vars.BAOLEYUN_HOST }}
          DEPLOY_USER: ${{ vars.BAOLEYUN_USER }}
          DEPLOY_REF: main
          DEPLOY_SHA: ${{ steps.plan.outputs.target_sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          case "$DEPLOY_REF" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "Invalid DEPLOY_REF: $DEPLOY_REF" >&2
              exit 1
              ;;
          esac
          case "$DEPLOY_SHA" in
            ''|[0-9a-fA-F]*)
              ;;
            *)
              echo "Invalid DEPLOY_SHA: $DEPLOY_SHA" >&2
              exit 1
              ;;
          esac

          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          deploy_image_name="ghcr.io/${owner}/sub2api"

          printf -v DEPLOY_REF_Q '%q' "$DEPLOY_REF"
          printf -v DEPLOY_SHA_Q '%q' "$DEPLOY_SHA"
          printf -v DEPLOY_IMAGE_NAME_Q '%q' "$deploy_image_name"
          printf -v GHCR_USERNAME_Q '%q' "$GHCR_USERNAME"
          {
            printf '%s\n' "$GHCR_TOKEN"
            cat <<'REMOTE'
          set -euo pipefail

          REPO_DIR="/opt/sub2api/repo"
          RUNTIME_DIR="/opt/sub2api/runtime"

          cd "$REPO_DIR"
          git fetch origin "$DEPLOY_REF"
          if [ -n "$DEPLOY_SHA" ]; then
            git switch --detach "$DEPLOY_SHA"
          else
            git switch --detach FETCH_HEAD
          fi
          git status --short
          DEPLOY_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${DEPLOY_SHA:0:12}"
          IMAGE="${DEPLOY_IMAGE_NAME}:main-${SHORT_SHA}"

          find backend/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort > /tmp/sub2api-main-migrations.expected

          cd "$RUNTIME_DIR"
          if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
          fi
          docker pull "$IMAGE"

          docker compose up -d postgres redis < /dev/null
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U "${POSTGRES_USER:-sub2api}" -d "${POSTGRES_DB:-sub2api}" < /dev/null >/dev/null 2>&1; then
              break
            fi
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "Postgres did not become ready before deployment" >&2
              exit 1
            fi
          done

          if [ "$(docker compose exec -T postgres psql -U "${POSTGRES_USER:-sub2api}" -d "${POSTGRES_DB:-sub2api}" -Atc "SELECT to_regclass('public.schema_migrations') IS NOT NULL" < /dev/null)" = "t" ]; then
            docker compose exec -T postgres psql -U "${POSTGRES_USER:-sub2api}" -d "${POSTGRES_DB:-sub2api}" -Atc \
              "SELECT filename FROM schema_migrations ORDER BY filename" < /dev/null > /tmp/sub2api-main-migrations.applied
          else
            : > /tmp/sub2api-main-migrations.applied
          fi
          if comm -23 /tmp/sub2api-main-migrations.applied /tmp/sub2api-main-migrations.expected | grep -q .; then
            echo "Database has migrations that are not present in the main commit being deployed:" >&2
            comm -23 /tmp/sub2api-main-migrations.applied /tmp/sub2api-main-migrations.expected >&2
            echo "Refusing to deploy to avoid running main code against a schema from another branch." >&2
            exit 1
          fi

          cp docker-compose.yml "docker-compose.yml.bak-main-${SHORT_SHA}-$(date +%Y%m%d%H%M%S)"
          sed -i "/^[[:space:]]*sub2api:/,/^[[:space:]]*[A-Za-z0-9_-][A-Za-z0-9_-]*:/ s#^\([[:space:]]*image:[[:space:]]*\).*#\1${IMAGE}#" docker-compose.yml
          if ! sed -n "/^[[:space:]]*sub2api:/,/^[[:space:]]*[A-Za-z0-9_-][A-Za-z0-9_-]*:/p" docker-compose.yml | grep -F "image: ${IMAGE}"; then
            echo "Failed to update sub2api image in docker-compose.yml" >&2
            exit 1
          fi

          docker compose run --rm --no-deps --entrypoint sh sub2api -c 'if [ -d /app/data/public ]; then echo "Removing stale runtime frontend override so the deployed image serves its embedded frontend."; rm -rf /app/data/public.previous-image-deploy; mv /app/data/public /app/data/public.previous-image-deploy; fi' < /dev/null

          docker compose up -d --no-build --force-recreate sub2api < /dev/null
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health < /dev/null >/dev/null 2>&1; then
              break
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then
              docker compose ps
              docker compose logs --tail=120 sub2api || true
              echo "sub2api did not become healthy before deployment verification timed out" >&2
              exit 1
            fi
          done

          docker compose ps
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS https://code.hahacode.top/health
          REMOTE
          } | ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" "env DEPLOY_REF=${DEPLOY_REF_Q} DEPLOY_SHA=${DEPLOY_SHA_Q} DEPLOY_IMAGE_NAME=${DEPLOY_IMAGE_NAME_Q} GHCR_USERNAME=${GHCR_USERNAME_Q} sh -c 'IFS= read -r GHCR_TOKEN; export GHCR_TOKEN; bash -se'"

      - name: Deploy frontend files
        if: ${{ steps.plan.outputs.mode == 'frontend' }}
        env:
          DEPLOY_HOST: ${{ vars.BAOLEYUN_HOST }}
          DEPLOY_USER: ${{ vars.BAOLEYUN_USER }}
        run: |
          scp -i ~/.ssh/id_deploy frontend-dist.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/sub2api-main-frontend-dist.tar.gz"
          ssh -i ~/.ssh/id_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail

          RUNTIME_DIR="/opt/sub2api/runtime"
          RELEASE_DIR="/tmp/sub2api-main-frontend-dist"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf /tmp/sub2api-main-frontend-dist.tar.gz -C "$RELEASE_DIR"
          test -f "$RELEASE_DIR/index.html"

          cd "$RUNTIME_DIR"
          CONTAINER_ID="$(docker compose ps -q sub2api)"
          if [ -z "$CONTAINER_ID" ]; then
            echo "sub2api container not found" >&2
            exit 1
          fi

          docker exec "$CONTAINER_ID" sh -c 'rm -rf /app/data/public.next /app/data/public.previous && mkdir -p /app/data/public.next'
          docker cp "${RELEASE_DIR}/." "$CONTAINER_ID:/app/data/public.next/"
          printf '%s\n' "${{ steps.plan.outputs.target_sha }}" > "$RELEASE_DIR/.deploy-sha"
          docker cp "$RELEASE_DIR/.deploy-sha" "$CONTAINER_ID:/app/data/public.next/.deploy-sha"
          docker exec "$CONTAINER_ID" sh -c 'test -f /app/data/public.next/index.html && if [ -d /app/data/public ]; then mv /app/data/public /app/data/public.previous; fi && mv /app/data/public.next /app/data/public'

          rm -rf "$RELEASE_DIR"
          rm -f /tmp/sub2api-main-frontend-dist.tar.gz

          curl -fsS http://127.0.0.1:8080/health
          curl -fsS https://code.hahacode.top/health
          REMOTE

      - name: Skip unchanged deployment
        if: ${{ steps.plan.outputs.mode == 'noop' }}
        run: echo "main is already deployed; nothing to do."
