name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      force_backend_image:
        description: Run backend checks and publish the backend image for this ref
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      ci: ${{ steps.filter.outputs.ci }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # For pushes to long-lived branches, compare against the previous
          # commit on the same branch instead of the repository default branch.
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'backend/**'
              - '.github/ci/check-destructive-migrations.py'
              - 'deploy/**'
              - 'Dockerfile'
              - 'Dockerfile.goreleaser'
              - '.goreleaser*.yaml'
              - 'Makefile'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/deploy-dev.yml'
              - '.github/workflows/deploy-main.yml'
            ci:
              - '.github/ci/**'
              - '.github/ci/check-destructive-migrations.py'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/deploy-dev.yml'
              - '.github/workflows/deploy-main.yml'
            frontend:
              - 'frontend/**'
              - 'third_party/gpt_image_playground/**'
              - 'tools/image-playground/**'
              - 'Makefile'
              - '.github/ci/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/deploy-dev.yml'
              - '.github/workflows/deploy-main.yml'

  deploy-plan-tests:
    name: Deploy Plan Tests
    needs: changes
    if: ${{ needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deploy plan scripts
        run: |
          bash -n .github/ci/resolve-main-deploy-plan.sh .github/ci/resolve-main-deploy-plan.test.sh
          bash .github/ci/resolve-main-deploy-plan.test.sh
          python3 -m py_compile .github/ci/check-destructive-migrations.py .github/ci/check-destructive-migrations.test.py
          python3 .github/ci/check-destructive-migrations.test.py

  migration-safety:
    name: Migration Safety
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check destructive migrations
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/ci/check-destructive-migrations.py ci "$BASE_SHA" "$HEAD_SHA"

  backend:
    name: Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_backend_image) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Unit tests
        working-directory: backend
        run: make test-unit

      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    name: Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint:check

      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Critical tests
        run: make test-frontend-critical

      - name: Build
        working-directory: frontend
        run: pnpm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          if-no-files-found: error
          retention-days: 2

  golangci-lint:
    name: Go Lint
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_backend_image) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  docker-build:
    name: Docker Build
    needs:
      - changes
      - backend
      - golangci-lint
      - migration-safety
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && (needs.changes.outputs.backend == 'true' || inputs.force_backend_image) && needs.backend.result == 'success' && needs.golangci-lint.result == 'success' && (needs.migration-safety.result == 'success' || needs.migration-safety.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: image
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"
          echo "name=ghcr.io/${owner}/sub2api" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=sub2api-${{ github.ref_name }}
          cache-to: type=gha,scope=sub2api-${{ github.ref_name }},mode=max
          build-args: |
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
